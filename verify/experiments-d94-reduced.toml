# Reduced real panel of D94q and D94r (read by verify/experiments-d94.jl). Overrides on the [panel] block of the P1 preregistration
# (K list, N_scr, thresholds, q_max, grid_side and the rest are the P1 values, which the p3 test draw keeps: "Test draw", item 1).
# Values below are read from the PROSE of workspaces/study/stages/01-design/output/p3-abstention-preregistration.md (the machine-readable
# block is not written yet, owner decision P69): "Test draw" items 2 to 5 and the register rows "screening size, R_max, per-cell sizes",
# "D fractions, size of D_B" and "test_seed". Reduced: screen_points 4096 (study: 262144), r_max 3 (study: 5).
[panel]
seed = 20261030
screen_source = "random"
screen_points = 4096
